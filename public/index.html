      rtt=r;
      break;
    }
    case 'ROOM_CREATED':
  roomId=m.roomId;
  token=m.token;
  role='commander';

  localStorage.sr=JSON.stringify({
    roomId,
    token
  });

  saveRoomHistory(roomId,token);
  clearTimeout(roomConnectTimer);

  view='room';
  err='';

    case 'POS':if(snap&&snap.songId===m.songId&&snap.state==='playing'){snap.position=m.position;snap.serverTime=m.serverTime}break;

    case 'STATE_UPDATE':

}

  function rm(n){const k=notes.indexOf(n);if(k<0)return;notes.splice(k,1);clearTimeout(n.t);n.el.style.opacity='0';n.el.style.transform='translateY(-18px) scale(.95)';setTimeout(()=>n.el.remove(),350);layout()}
  function pushNote(m){
