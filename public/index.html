}

header b i{color:transparent}
.brand{width:fit-content;margin:0 auto;font:900 clamp(24px,6.5vw,40px)/1.1 system-ui,sans-serif;letter-spacing:.07em;filter:drop-shadow(0 3px 14px #ff4d8d55)}

#st{scroll-margin-top:12px}
#amb{position:fixed;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;z-index:0;background:radial-gradient(55vmax 55vmax at 20% 25%,#ff4d8d,transparent 70%),radial-gradient(60vmax 60vmax at 82% 20%,#a78bfa,transparent 70%),radial-gradient(65vmax 65vmax at 55% 92%,#ffc94d,transparent 70%),radial-gradient(45vmax 45vmax at 90% 85%,#22d3ee,transparent 70%);background-size:160% 160%;mix-blend-mode:screen;filter:saturate(1.4) brightness(1.25);animation:ambm 7s ease-in-out infinite alternate;will-change:background-position}
body.amb #amb{opacity:1}

.plb h2{margin:0 0 4px}.pll{margin:12px 0;max-height:240px;overflow-y:auto;display:grid;gap:8px}

</style>
</head>
<body>
<div id="amb"></div>
<div id="app"></div>
<div id="ytDock"><div id="yt-player"></div></div>
<audio id="au" preload="auto" playsinline></audio>
<script>
const $=s=>document.querySelector(s),app=$('#app'),au=$('#au');
const now=()=>performance.timeOrigin+performance.now();
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');

let uid='';
try{uid=localStorage.uid||''}catch{}
if(!/^[a-f0-9]{32}$/.test(uid)){
  uid=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  try{localStorage.uid=uid}catch{}
}
const UH={'X-Uid':uid};

let ws=null,view='home',pending=null,roomId=null,token=null,role=null,snap=null,songs=[],err='',conn='connecting',
offset=0,rtt=0,samples=[],audioOn=false,loaded=null,tgt=0,drift=0,synced=true,lastSeek=0,dragging=false,key='',
boost=1,uploadBusy=false,uploadStatus='',lastDur=0,errT=null,qmap={},yl=[],qv=null,lastReq=0,lastStatus='',preId=null,
lastReady=0,ytLoading=false,ytProgress=0,ytSongId=null,spotifyLoading=false,roomConnectTimer=null;

let seekLat=0.3,seekAt=0,ytLat=0.8,ytSeekAt=0,ytRate=1,syncAdj=0;try{syncAdj=Number(localStorage.syncAdj)||0}catch{}
let audioContext=null,gainNode=null;const qrCache={};let qrBusy=false;
function setupAudioBoost(){
  if(audioContext)return;
  try{
    audioContext=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioContext.createMediaElementSource(au);
    gainNode=audioContext.createGain();
    src.connect(gainNode);gainNode.connect(audioContext.destination);
    gainNode.gain.value=boost;
  }catch(e){console.warn('Audio boost unavailable:',e)}
}
function nudge(d){setAdj(Math.round((syncAdj+d)*10)/10);const s=$('#adjS');if(s)s.value=syncAdj}
function setAdj(v){syncAdj=Number(v)||0;try{localStorage.syncAdj=syncAdj}catch{}const e=$('#adjV');if(e)e.textContent=(syncAdj>0?'+':'')+syncAdj.toFixed(2)+'s'}
function setBoost(v){
  boost=Number(v);
  if(gainNode)gainNode.gain.value=boost;
  const el=$('#boostValue');
  if(el)el.textContent=boost.toFixed(1)+'×';
}

const pre=new Audio();
pre.preload='auto';
let ytPlayer=null,ytApiReady=false,ytApiLoading=false,ytLoadedId=null,deviceVolume=0.9;
function loadYouTubeAPI(){
  if(window.YT&&window.YT.Player){ytApiReady=true;return Promise.resolve()}
  if(ytApiLoading)return window.__srYTReadyPromise;
  ytApiLoading=true;
  window.__srYTReadyPromise=new Promise(resolve=>{
    const previous=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{if(previous)try{previous()}catch{}ytApiReady=true;resolve()};
    const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  });
  return window.__srYTReadyPromise;
}
function destroyYT(){
  const had=!!ytPlayer;
  if(ytPlayer){try{ytPlayer.stopVideo();ytPlayer.destroy()}catch{}}
  ytPlayer=null;ytLoadedId=null;
  const d=document.getElementById('ytDock');
  if(d){d.classList.remove('on');if(had)d.innerHTML='<div id="yt-player"></div>'}
  document.body.classList.remove('yt-on');
}
function setDeviceVolume(v){
  deviceVolume=Math.max(0,Math.min(1,Number(v)||0));
  au.volume=deviceVolume;
  if(ytPlayer&&typeof ytPlayer.setVolume==='function')ytPlayer.setVolume(deviceVolume*100);
}
function fixAudio(p){
  try{
    if(!p||typeof p.isMuted!=='function')return;
    if(p.isMuted())p.unMute();
    p.setVolume(Math.max(deviceVolume,0.05)*100);
  }catch{}
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(ytPlayer)fixAudio(ytPlayer)},{passive:true}));
const dbgLog=[];function dbg(m){dbgLog.push(new Date().toLocaleTimeString()+'  '+m);if(dbgLog.length>40)dbgLog.shift()}
window.addEventListener('error',e=>dbg('JS ERROR: '+e.message));window.addEventListener('unhandledrejection',e=>dbg('PROMISE: '+(e.reason&&e.reason.message||e.reason)));
let ytGate=0,ytStartAt=0,ytPlayedOnce=false;const ytFB=new Set();
function toFallback(vid,why){if(!vid||ytFB.has(vid))return;dbg('FALLBACK to server audio ('+(why||'?')+')');ytFB.add(vid);flash('Using server audio for this song...');destroyYT();loaded=null}
function syncYouTube(song,target,playing,hold){
  if(!song||!song.videoId||song.source==='spotify'||ytFB.has(song.videoId))return;
  const want=!!(audioOn&&(playing||hold));
  loadYouTubeAPI().then(()=>{
    if(!snap||snap.songId!==song.id)return;
    if(ytPlayer&&ytLoadedId!==song.id){
      try{ // reuse the existing player: much faster than rebuilding the iframe
        ytLoadedId=song.id;ytGate=now()+1500;ytStartAt=now();ytPlayedOnce=false;ytRate=1;try{ytPlayer.setPlaybackRate(1)}catch{}
        const o={videoId:song.videoId,startSeconds:Math.floor(Math.max(0,target||0))};
        if(want)ytPlayer.loadVideoById(o);else ytPlayer.cueVideoById(o);
        return;
      }catch{destroyYT()}
    }
    if(!ytPlayer){
      const host=document.getElementById('yt-player');if(!host)return;
      ytLoadedId=song.id;ytGate=now()+1500;ytStartAt=now();ytPlayedOnce=false;
      ytPlayer=new YT.Player(host,{height:'180',width:'320',videoId:song.videoId,playerVars:{autoplay:want?1:0,start:Math.floor(Math.max(0,target||0)),controls:0,disablekb:1,playsinline:1,rel:0,modestbranding:1},events:{
        onReady:e=>{fixAudio(e.target);if(audioOn&&snap&&(snap.state==='playing'||(role==='commander'&&snap.state==='loading'))){try{e.target.seekTo(snap.state==='playing'?Math.max(0,tgt):0,true)}catch{}e.target.playVideo()}},
        onStateChange:e=>{
          if(e.data===YT.PlayerState.ENDED&&role==='commander'&&ytLoadedId&&snap?.songId===ytLoadedId)cmd('ENDED',{id:ytLoadedId});
          if(e.data===YT.PlayerState.PLAYING){ytPlayedOnce=true;if(ytSeekAt){ytLat=0.5*ytLat+0.5*Math.min(2.5,(now()-ytSeekAt)/1000);ytSeekAt=0}fixAudio(e.target);setTimeout(()=>fixAudio(e.target),400);
            if(role==='commander'&&snap&&snap.state==='loading'&&snap.songId===ytLoadedId)cmd('AUDIO_READY',{id:ytLoadedId});
            const d=e.target.getDuration();if(role==='commander'&&d>0&&ytLoadedId)cmd('LOCAL_DURATION_UPDATE',{id:ytLoadedId,duration:d})}
        },
        onError:e=>{dbg('YT embed error '+e.data);toFallback(song.videoId,'embed error '+e.data)}
      }});
      return;
    }
    try{
      if(typeof ytPlayer.getPlayerState!=='function')return;
      if(audioOn&&(playing||hold))fixAudio(ytPlayer);else ytPlayer.setVolume(deviceVolume*100);
      if(now()<ytGate)return;
      const ps=ytPlayer.getPlayerState(),P=YT.PlayerState;
      if(role==='commander'){const d=Number(ytPlayer.getDuration()||0);if(d>0&&Math.abs((song.duration||0)-d)>1&&now()-lastDur>3000){lastDur=now();cmd('LOCAL_DURATION_UPDATE',{id:song.id,duration:d})}}
      if(hold&&ps===P.PLAYING&&now()-lastReady>700){lastReady=now();cmd('AUDIO_READY',{id:song.id})}
      if((playing||hold)&&audioOn&&!ytPlayedOnce&&now()-ytStartAt>6000){toFallback(song.videoId,'no playback in 6s');return}
      if(playing||hold){
        if(audioOn&&(ps===-1||ps===P.PAUSED||ps===P.CUED)){try{if(ytPlayer.isMuted())ytPlayer.unMute()}catch{}ytPlayer.playVideo()}
        else if(playing&&ps===P.PLAYING){
          const drift=Number(ytPlayer.getCurrentTime()||0)-target,a=Math.abs(drift);
          if(a>0.6&&now()-lastSeek>2500){lastSeek=now();ytSeekAt=now();ytRate=1;try{ytPlayer.setPlaybackRate(1)}catch{}ytPlayer.seekTo(Math.max(0,target+ytLat),true)}
          else{const r=a>(ytRate!==1?0.06:0.15)?(drift<0?1.25:0.75):1;if(r!==ytRate){ytRate=r;try{ytPlayer.setPlaybackRate(r)}catch{}}}
        }
      }else if(ps===P.PLAYING||ps===P.BUFFERING)ytPlayer.pauseVideo();
    }catch(e){}
  }).catch(()=>{});
}
loadYouTubeAPI();
// ---- Saved playlists (stored on this device) ----
const PLK='srPlaylists';let plOpen=null;
const getPL=()=>{try{return JSON.parse(localStorage.getItem(PLK)||'[]')}catch{return[]}};
const setPL=a=>{try{localStorage.setItem(PLK,JSON.stringify(a))}catch{flash('Could not save playlist.')}};
const slim=s=>({videoId:s.videoId,title:s.title,artist:s.artist,artwork:s.artwork,source:s.source==='spotify'?'spotify':'youtube'});
function addTracks(name,tr){
  const a=getPL();let p=a.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){p={id:Date.now().toString(36),name,tracks:[]};a.push(p)}
  tr.forEach(t=>{if(!p.tracks.some(x=>x.videoId===t.videoId))p.tracks.push(t)});
  setPL(a);plOpen=p.id;draw();
}
function pickPL(cb,title){
  const old=document.getElementById('plm');if(old)old.remove();
  const a=getPL(),m=document.createElement('div');m.id='plm';
  m.innerHTML=`<div class="plb"><h2>${esc(title||'Add to playlist')}</h2><div class="lbl">Tap a playlist, or create a new one</div><div class="pll">${a.map((p,i)=>`<button data-i="${i}">📁 ${esc(p.name)} <span class="lbl">· ${p.tracks.length}</span></button>`).join('')||'<div class="lbl" style="padding:8px">No playlists yet.</div>'}</div><div class="plnew"><input id="plnew" maxlength="40" placeholder="New playlist name" autocomplete="off"><button class="pri small wide" id="plmk">Create</button></div><button id="plx" style="width:100%;margin-top:8px">Cancel</button></div>`;
  const close=()=>m.remove();
  m.onclick=e=>{if(e.target===m)close()};
  m.querySelectorAll('.pll button').forEach(b=>b.onclick=()=>{close();cb(a[+b.dataset.i].name)});
  m.querySelector('#plx').onclick=close;
  const mk=()=>{const n=m.querySelector('#plnew').value.trim();if(n){close();cb(n)}};
  m.querySelector('#plmk').onclick=mk;m.querySelector('#plnew').onkeydown=e=>{if(e.key==='Enter')mk()};
  document.body.appendChild(m);
}
function saveSong(id){const s=getSong(id);if(!s||!s.videoId)return;pickPL(n=>addTracks(n,[slim(s)]),'Save song to playlist')}
function savePlaylist(){
  const tr=(snap?.queue||[]).map(getSong).filter(s=>s&&s.videoId).map(slim);
  if(!tr.length){flash('Add a YouTube song first.');return}
  pickPL(n=>addTracks(n,tr),'Save queue to playlist');
}
const togglePL=id=>{plOpen=plOpen===id?null:id;draw()};
function delPL(id){if(confirm('Delete this playlist?')){setPL(getPL().filter(p=>p.id!==id));draw()}}
function rmFromPL(id,i){const a=getPL(),p=a.find(x=>x.id===id);if(p){p.tracks.splice(i,1);setPL(a);draw()}}
function playPL(id,i){
  const p=getPL().find(x=>x.id===id);if(!p||!p.tracks.length)return;unlock();goTop();
  cmd('PL_ADD',{tracks:i==null?p.tracks:[p.tracks[i]],play:true});
}
function addLinkPL(pid){
  const p=pid&&getPL().find(x=>x.id===pid);
  const go=async name=>{
    const u=(prompt('Paste a YouTube or Spotify link (song or playlist) to add to "'+name+'":')||'').trim();if(!u)return;
    flash('Fetching song...');
    try{
      const r=await fetch(/spotify\.com/i.test(u)?'/api/spotify/resolve':'/api/youtube/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
      const j=await r.json();if(!r.ok||!j.tracks||!j.tracks.length)throw new Error(j.error||'No songs found for that link.');
      addTracks(name,j.tracks.map(slim));flash('Added '+j.tracks.length+' song'+(j.tracks.length===1?'':'s')+' to "'+name+'"');
    }catch(e){flash(e.message||'Could not add that link.')}
  };
  if(p)go(p.name);else pickPL(go,'Add link to playlist');
}
function plCard(){

function getFileDuration(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file),m=document.createElement('video');
    m.preload='metadata';
    m.onloadedmetadata=()=>{const d=Number(m.duration)||0;URL.revokeObjectURL(url);resolve(d)};
    m.onerror=()=>{URL.revokeObjectURL(url);resolve(0)};
    m.src=url;
  });
}

async function uploadOne(file){
  const duration=await getFileDuration(file);
  const r=await fetch('/api/upload',{
    method:'POST',

    body:file
  });
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||'Upload failed');
  return data.song;
}

function connect(){
  if(ws&&ws.readyState===WebSocket.OPEN){
    if(pending){const m=pending;pending=null;tx(m)}
    else if(view==='room'&&roomId)tx({type:'ROOM_JOIN',roomId,token});
    return;
  }
  if(ws&&ws.readyState===WebSocket.CONNECTING)return;

  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');

  ws.onopen=()=>{
    conn='connected';samples=[];
    clearTimeout(roomConnectTimer);
    for(let i=0;i<6;i++)setTimeout(ping,i*150);
    if(pending){const m=pending;pending=null;tx(m)}
    else if(view==='room'&&roomId)tx({type:'ROOM_JOIN',roomId,token});

    clearTimeout(roomConnectTimer);
    if(view==='room'){
      roomConnectTimer=setTimeout(()=>{
        if(view==='room'&&!snap){
          if(ws){try{ws.onclose=null;ws.close()}catch{}ws=null}
          reset('Could not connect to this room. You are back on Home.');
          conn='connecting';
          draw();
        }
      },10000);
    }

    draw();
  };
  ws.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(x){console.warn('onMsg error:',x)}};
  ws.onerror=e=>{console.warn('SYNCROOM WebSocket error:',e);conn='reconnecting';draw()};
  ws.onclose=()=>{
    ws=null;
    if(view==='room'||pending){
      conn='reconnecting';draw();
      setTimeout(()=>{if((view==='room'||pending)&&!ws)connect()},1500);
    }
  };
}

const ping=()=>tx({type:'TIME_PING',t0:now()});
setInterval(()=>{if(conn==='connected')ping()},3000);

function onMsg(m){
  switch(m.type){
    case 'TIME_PONG':{
      const t1=now(),r=t1-m.t0;
      if(!isFinite(r)||!isFinite(m.ts))break;
      samples.push({r,o:m.ts+r/2-t1});
      samples=samples.slice(-16);
      offset=samples.reduce((a,c)=>c.r<a.r?c:a).o;
      rtt=r;
      break;
    }
    case 'ROOM_CREATED':
  roomId=m.roomId;
  token=m.token;
  role='commander';

  localStorage.sr=JSON.stringify({
    roomId,
    token
  });

  saveRoomHistory(roomId,token);
  clearTimeout(roomConnectTimer);
  roomConnectTimer=null;

  view='room';
  err='';
  draw();
  break;
    case 'JOINED':
      clearTimeout(roomConnectTimer);
      roomConnectTimer=null;
      role=m.role;view='room';err='';draw();
      break;
    case 'STATE_UPDATE':
    case 'SYNC_RESPONSE':{
      const st=m.state,oldSong=snap?.songId,oldState=snap?.state;
      snap=st;document.body.classList.toggle('amb',!!st.amb);
      clearTimeout(roomConnectTimer);
      roomConnectTimer=null;
      if(st.qs){qmap={};st.qs.forEach(s=>{qmap[s.id]=s});yl=st.yl||[];qv=st.qv}
      else if(st.qv!==qv&&now()-lastReq>1000){lastReq=now();tx({type:'SYNC_REQUEST'})}
      const k=[snap.songId,snap.state,snap.repeat,role==='commander'?snap.devices:0,snap.commanderOnline,snap.song?.duration,snap.amb,qv].join('|');
      if(k!==key||oldSong!==snap.songId||oldState!==snap.state){key=k;draw()}
      tick();
      break;
    }
    case 'ERROR':
      if(!snap&&(view==='room'||view==='join')){reset(m.message);au.pause();draw()}
      else flash(m.message);
      break;
    case 'NOTICE':flash(m.message);break;
    case 'ROOM_ENDED':
      localStorage.removeItem('sr');
      reset('The room was ended by the Commander.');
      au.pause();
      draw();
      break;
  }
}

function tick(){
  if(!snap||!snap.song){if(!au.paused)au.pause();destroyYT();return}
  const s=snap,song=s.snapSong||s.song,playing=s.state==='playing';
  tgt=Math.max(0,s.position+(playing?(serverNow()-s.serverTime)/1000+syncAdj:0));if(song.duration>0)tgt=Math.min(song.duration,tgt);if(!isFinite(tgt))tgt=0;
  if(song.videoId&&song.source!=='spotify'&&!ytFB.has(song.videoId)){
    const dk=document.getElementById('ytDock');if(dk&&!dk.classList.contains('on')){dk.classList.add('on');document.body.classList.add('yt-on')}
    if(loaded){au.pause();au.removeAttribute('src');loaded=null}
    syncYouTube(song,tgt,playing,s.state==='loading'&&role==='commander');
    if(ytLoading&&ytLoadedId===song.id){ytLoading=false;ytProgress=100;draw()}
  }else{
    destroyYT();
    if(role==='commander'&&isFinite(au.duration)&&au.duration>0&&loaded===song.id&&Math.abs((song.duration||0)-au.duration)>0.5&&now()-lastDur>3000){lastDur=now();cmd('LOCAL_DURATION_UPDATE',{id:song.id,duration:au.duration})}
    if(s.state==='loading'&&role==='commander'&&loaded===song.id&&au.readyState>=3&&now()-lastReady>700){lastReady=now();cmd('AUDIO_READY',{id:song.id})}
    if(loaded!==song.id){au.pause();au.src=song.audio||(song.videoId?'/yt-audio/'+song.videoId:'');au.load();loaded=song.id;setBoost(boost)}
    if(playing){if(au.paused&&audioOn)au.play().catch(e=>{if(now()-(window.__pe||0)>3000){window.__pe=now();dbg('au.play() blocked: '+e.name+' '+e.message)}});const d=au.currentTime-tgt,a=Math.abs(d);drift=d;if(a>0.4&&now()-lastSeek>1500&&!au.seeking){try{au.currentTime=tgt+seekLat;seekAt=now()}catch{}lastSeek=now();au.playbackRate=1}else if(a>0.06)au.playbackRate=1-Math.max(-0.1,Math.min(0.1,d*0.5));else au.playbackRate=1;synced=a<0.25}else{if(!au.paused)au.pause();au.playbackRate=1;if(Math.abs(au.currentTime-tgt)>0.05){try{au.currentTime=tgt}catch{}}synced=true}
  }
  const cur=$('#cur');if(cur)cur.textContent=fmt(tgt);const bar=$('#bar');if(bar&&!dragging){if(song.duration>0)bar.max=song.duration;bar.value=tgt}const pb=$('#pb');if(pb&&song.duration>0)pb.style.width=(100*tgt/song.duration)+'%';const st=$('#st');if(st){const h=status();if(h!==lastStatus){lastStatus=h;st.innerHTML=h}}preload();
}

}

}

const addBox=(id,t,ph,fn)=>`<section class="source-card"><h3>${t}</h3><div style="margin-top:8px"><input id="${id}" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${ph}" onkeydown="if(event.key==='Enter')${fn}(false)"></div><div class="two" style="grid-template-columns:1fr"><button class="pri" onclick="${fn}(false)">＋ Add to queue</button></div></section>`;
const addCard=()=>`<section class="card"><h2>➕ Add songs to the queue</h2><div class="lbl">Anyone can add songs · only the Commander plays them</div><div class="source-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${addBox('ytUrl','▶ YouTube','YouTube video or playlist link','addYT')}${addBox('spotifyUrl','🟢 Spotify','Spotify track, album or playlist link','addSpotify')}</div></section>`;
function room(){
  if(!snap){
    return HEADER('Connecting...')+`<section class="card">
      <h2>Connecting to room ${esc(roomId||'')}...</h2>
      <p class="lbl">Syncing room state...</p>
      <div class="row"><button onclick="location.reload()">Reload</button><button onclick="cancelJoin()">✕ Cancel</button></div>
    </section>`;
  }

  const song=snap.song,playing=snap.state==='playing'||snap.state==='loading',cmdr=role==='commander';
  let h=HEADER(cmdr?'👑 Commander':'📱 Room '+esc(roomId));
  if(err)h+=`<p class="w" style="text-align:center">${esc(err)}</p>`;

  if(cmdr){
    h+=`<section class="card">
      <div class="lbl">Scan to join with any phone</div>
      <div class="qr-box"><img id="qr" alt="Scan to join"></div>
      <div class="room-code-display">${esc(roomId)}</div>
      <p class="lbl">${snap.devices} device${snap.devices===1?'':'s'} connected</p>
    </section>`;
  }

  if(!audioOn){
    h+=`<section class="card"><button class="pri" style="width:100%;font-size:16px" onclick="unlock()">🔊 Enable synchronized audio</button></section>`;
  }

  if(song){
    h+=`${song.videoId&&song.source!=='spotify'?`<div class="yt-note">▶ YouTube streams directly — no server download.</div>`:''}
      <div id="st" class="st">${status()}</div>
      <div class="art-container ${playing?'playing':''}">
        <span class="art-badge">🎵 ${song.source==='spotify'?'Spotify':isYT(song)?'YouTube':'Local'}</span>
        <img class="art" src="${esc(thumb(song))}" alt="${esc(song.title||'')}" ${FALLBACK}>
      </div>
      <h1>${esc(song.title||'Untitled')}</h1>
      <p class="c">${esc(song.artist||'')}${song.album?' · '+esc(song.album):''}</p>`;
    h+=cmdr
      ?`<input type="range" id="bar" min="0" max="${song.duration||0}" step="0.1" value="${tgt}" onpointerdown="dragging=true" onpointerup="dragging=false" onchange="dragging=false;cmd('SEEK',{position:+this.value})">`
      :`<div class="bar"><div id="pb"></div></div>`;
    h+=`<div class="t"><span id="cur">00:00</span><span>${song.duration>0?fmt(song.duration):'--:--'}</span></div>`;
  }else{
    h+=cmdr
      ?`<section class="card"><h2>Ready when you are</h2><p class="lbl">Pick a song from Local Music below, or paste a YouTube link.</p></section>`
      :`<section class="card"><h2>Waiting for the Commander</h2><p class="lbl">Music will start here when the Commander plays something.</p></section>`;
  }

  if(cmdr){
    h+=`<div class="row">
        <button onclick="cmd('SHUFFLE')" title="Shuffle queue">🔀 Shuffle</button>
        <button onclick="cmd('PREVIOUS')" title="Previous track">◀</button>
        <button class="pri big" onclick="togglePlayPause()" title="${playing?'Pause':'Play'}">${playing?'❚❚':'▶'}</button>
        <button onclick="cmd('NEXT')" title="Next track">▶</button>
        <button onclick="cycleRepeat()" title="Repeat mode">Repeat: ${snap.repeat}</button>
      </div>
      ${volumeCard('Audio Boost (Speaker amplification)')}
      <div class="source-grid">${localColumn()}${ytColumn()}${spotifyColumn()}</div>${plCard()}
      ${queue()}
      <button class="end" onclick="if(confirm('End the room for everyone?'))endRoom()">End Room</button>`;
  }else{
    h+=`${volumeCard('Audio Boost')}${addCard()}${queue()}
      <p class="c" style="margin-top:20px"><button onclick="leaveRoom()">Leave Room</button></p>`;
  }
  return h;
}

function draw(){
  lastStatus='';
  if(view==='home'){
  const history=getRoomHistory();

  app.innerHTML=HEADER('')+`
    <section class="card">
      <h2>Play one song on every phone</h2>

      <p class="lbl">
        One Commander controls the room; every phone plays in perfect sync.
      </p>

      ${err?`<p class="w">${esc(err)}</p>`:''}

      <button
        class="pri"
        style="margin-top:10px;width:100%;font-size:16px"
        onclick="startCommander()"
      >
        Create Room as Commander
      </button>
    </section>

    <section class="card">
      <div class="lbl">Have a 6-letter room code?</div>

      <div class="row">
        <input
          id="code"
          maxlength="6"
          placeholder="X7K92P"
        >

        <button onclick="goJoin()">Join</button>
      </div>
    </section>

    ${
      history.length
      ? `
        <section class="card">
          <h2>Room History</h2>

          <div style="display:grid;gap:8px">
            ${
              history.map(x=>`
                <div
                  style="
                    display:flex;
                    align-items:center;
                    gap:8px;
                    padding:10px;
                    background:#ffffff0b;
                    border:1px solid #ffffff12;
                    border-radius:14px;
                  "
                >
                  <div style="flex:1;text-align:left">
                    <b style="font-family:ui-monospace,monospace">
                      ${esc(x.roomId)}
                    </b>

                    <div class="lbl">
                      ${new Date(x.time).toLocaleString()}
                    </div>
                  </div>

                  <button
                    class="small"
                    onclick="openHistoryRoom('${esc(x.roomId)}')"
                    title="Open room"
                  >
                    ▶
                  </button>

                  <button
                    class="small"
                    onclick="removeHistoryRoom('${esc(x.roomId)}')"
                    title="Remove from history"
                  >
                    ✕
                  </button>
                </div>
              `).join('')
            }
          </div>
        </section>
      `
      : ''
    }
  `;

  return;
}
  if(view==='join'){
    app.innerHTML=HEADER('')+`<section class="card">
      <h2>Joining SYNCROOM...</h2>
      <div class="room-code-display">${esc(roomId||'')}</div>
      <p class="lbl">Connecting automatically...</p>
      ${err?`<p class="w">${esc(err)}</p>`:''}
      <div class="row"><button onclick="cancelJoin()">✕ Cancel</button></div>
    </section>`;
    return;
  }
  const yv=$('#ytUrl')?.value,sv=$('#spotifyUrl')?.value;
  app.innerHTML=room();
  const yi=$('#ytUrl');if(yi&&yv)yi.value=yv;const si=$('#spotifyUrl');if(si&&sv)si.value=sv;
  if(wantScroll&&Date.now()<wantScroll)tryScroll();
  const qr=$('#qr');
  if(qr&&roomId){
    if(qrCache[roomId])qr.src=qrCache[roomId];
    else if(!qrBusy){
      qrBusy=true;const rid=roomId;
      fetch('/api/qr/'+encodeURIComponent(rid)).then(r=>r.json()).then(d=>{qrBusy=false;if(d.dataUrl){qrCache[rid]=d.dataUrl;const el=$('#qr');if(el&&roomId===rid)el.src=d.dataUrl}else setTimeout(draw,2000)}).catch(()=>{qrBusy=false;setTimeout(draw,2000)});
    }
  }
}

draw();

</script>
</body>
</html>
